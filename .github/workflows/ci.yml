name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.test
        run: cargo test --locked
      # musl is linked statically, so the Linux binary runs on any distribution
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: tar -czf rxc-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release rxc
      - uses: actions/upload-artifact@v7
        with:
          name: rxc-${{ matrix.target }}
          path: rxc-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum rxc-*.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" rxc-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
